<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#7B6CF6" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Productivity Hub" />
  <title>Personal Productivity Hub</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #12101d;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .wrapper-frame {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      border: none;
      display: block;
      background: #12101d;
    }
    .fallback-bar {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 50;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(26, 22, 43, 0.82);
      color: #e6e2ff;
      font-size: 12px;
      text-decoration: none;
      border: 1px solid rgba(167, 155, 255, 0.25);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
      transition: transform 0.2s ease, background-color 0.2s ease;
    }
    .fallback-bar:hover {
      transform: translateY(-1px);
      background: rgba(41, 35, 69, 0.94);
    }
  </style>
</head>
<body>
  <a class="fallback-bar" href="https://script.google.com/macros/s/AKfycbz1ri1HwqnC7B67xiWv84RbFQcBLtYtrH-HBt-k5PayA4hphHswetfdYlWs2Tr-YpZ-/exec" target="_blank" rel="noopener noreferrer">
    <span>Buka Langsung</span>
    <span>↗</span>
  </a>
  <iframe
    class="wrapper-frame"
    src="https://script.google.com/macros/s/AKfycbz1ri1HwqnC7B67xiWv84RbFQcBLtYtrH-HBt-k5PayA4hphHswetfdYlWs2Tr-YpZ-/exec"
    title="Personal Productivity Hub"
    allow="clipboard-read; clipboard-write"
    referrerpolicy="strict-origin-when-cross-origin"
  ></iframe>
</body>
</html>
